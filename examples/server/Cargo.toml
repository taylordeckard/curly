[package]
name = "curly-testserver"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = { version = "7", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
prost = "0.14"
prost-types = "0.14"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"

[build-dependencies]
prost = "0.14"
protox = "0.10"
tonic-prost-build = "0.14"
