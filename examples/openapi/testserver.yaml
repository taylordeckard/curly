openapi: 3.0.3
info:
  title: curly test server
  version: 1.0.0
  description: |
    The local API used by the curly examples and integration tests.
    Served by curly-testserver at /openapi.yaml.
servers:
  - url: http://127.0.0.1:8787
    description: Local test server
tags:
  - name: meta
    description: Service health.
  - name: users
    description: User management.
  - name: auth
    description: Log in and inspect the current user.
security: []
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of users to return.
          schema:
            type: integer
            minimum: 1
            example: 10
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          example: 1
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such user.
  /login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in
      description: Exchanges a username and password for a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: demo
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: A bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Wrong credentials.
  /me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username:
                    type: string
        "401":
          description: Missing or invalid token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [name, email]
      properties:
        id:
          type: integer
          readOnly: true
          minimum: 1
        name:
          type: string
          example: Grace Hopper
        email:
          type: string
          format: email
    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        id:
          type: integer
          nullable: true
    Token:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
