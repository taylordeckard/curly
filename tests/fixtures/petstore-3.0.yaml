openapi: 3.0.3
info:
  title: Petstore Fixture
  version: 2.1.0
servers:
  - url: https://{region}.petstore.test/v{major}
    description: Production
    variables:
      region:
        default: eu
        enum: [eu, us]
      major:
        default: "2"
  - url: http://localhost:4010
    description: Local mock
tags:
  - name: pets
    description: Everything about pets.
  - name: store
security:
  - petstore_auth: [read:pets]
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List pets
      description: |
        Returns pets.
        @not-metadata this line starts with an at sign.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [available, pending, sold]
        - name: limit
          in: query
          schema:
            type: integer
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      tags: [pets]
      operationId: addPet
      summary: Add a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
            examples:
              rex:
                value:
                  name: Rex
                  category: {id: 1, name: Dogs}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      tags: [pets]
      operationId: getPetById
      summary: Find pet by ID
      deprecated: true
      responses:
        "200":
          description: A pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [pets]
      operationId: deletePet
      security:
        - api_key: []
        - basicAuth: []
      responses:
        "204":
          description: Deleted.
  /pets/{petId}/image:
    post:
      tags: [pets]
      operationId: uploadImage
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Uploaded.
  /store/order:
    post:
      tags: [store]
      summary: Place an order
      security:
        - basicAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                petId: {type: integer, example: 7}
                quantity: {type: integer}
                client_secret: {type: string, example: do-not-copy}
      responses:
        2XX:
          description: Placed.
  /store/inventory:
    get:
      tags: [store]
      operationId: getInventory
      security:
        - api_key_query: []
      responses:
        "200":
          description: Counts by status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /ping:
    get:
      security: []
      responses:
        "200":
          description: Pong.
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        example: 42
  responses:
    Error:
      description: Unexpected error.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string}
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.petstore.test/authorize
          tokenUrl: https://auth.petstore.test/token
          scopes:
            read:pets: Read pets
            write:pets: Modify pets
    api_key:
      type: apiKey
      name: X-API-Key
      in: header
    api_key_query:
      type: apiKey
      name: key
      in: query
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Category:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        parent:
          $ref: "#/components/schemas/Category"
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: doggie
        category:
          $ref: "#/components/schemas/Category"
        tag:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, pending, sold]
